env:
  - GO111MODULE=on
  - CGO_ENABLED=0

version: 2

before:
  hooks:
    - go mod download

builds:
  - id: goimports-reviser-amd64
    binary: goimports-reviser
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "main.Tag={{ .Tag }}" -X "main.Commit={{ .FullCommit }}" -X "main.SourceURL={{ .GitURL }}" -X "main.GoVersion={{ .Env.GO_VERSION }}"

  - id: goimports-reviser-darwin-amd64
    binary: goimports-reviser
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "main.Tag={{ .Tag }}" -X "main.Commit={{ .FullCommit }}" -X "main.SourceURL={{ .GitURL }}" -X "main.GoVersion={{ .Env.GO_VERSION }}"

  - id: goimports-reviser-windows-amd64
    binary: goimports-reviser
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X "main.Tag={{ .Tag }}" -X "main.Commit={{ .FullCommit }}" -X "main.SourceURL={{ .GitURL }}" -X "main.GoVersion={{ .Env.GO_VERSION }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
  github:
    owner: incu6us
    name: goimports-reviser

homebrew_casks:
  - name: goimports-reviser
    repository:
      owner: incu6us
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: incu6us
      email: vyacheslavpryimak@gmail.com
    homepage: "https://github.com/incu6us/goimports-reviser"
    description: "Right imports sorting & code formatting tool"
    # The binaries are not signed/notarized, so Gatekeeper would quarantine them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/goimports-reviser"]
          end

snapcrafts:
  - id: goimports-reviser
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    publish: true
    summary: "Right imports sorting & code formatting tool"
    description: |
      Tool for Golang to sort goimports by 3 groups: std, general and project dependencies. Also, formatting for your code will be prepared(so, you don't need to use gofmt or goimports separately).
    grade: stable
    confinement: strict
    license: MIT
